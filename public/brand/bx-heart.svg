<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="BX heart logo">
  <defs>
    <linearGradient id="hShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#c8261d"/>
    </linearGradient>
  </defs>
  <!-- Soft drop shadow -->
  <g transform="translate(100 102) rotate(-6)">
    <path d="M 0 -55
             C -8 -78, -55 -85, -75 -55
             C -92 -28, -55 5, 0 55
             C 55 5, 92 -28, 75 -55
             C 55 -85, 8 -78, 0 -55 Z"
          fill="rgba(48,33,15,0.18)"
          transform="translate(0 6)"/>
  </g>
  <!-- Heart sticker -->
  <g transform="translate(100 100) rotate(-6)">
    <path d="M 0 -55
             C -8 -78, -55 -85, -75 -55
             C -92 -28, -55 5, 0 55
             C 55 5, 92 -28, 75 -55
             C 55 -85, 8 -78, 0 -55 Z"
          fill="url(#hShine)"
          stroke="#30210f"
          stroke-width="4"
          stroke-linejoin="round"/>
    <!-- Inner thin highlight ring (sticker feel) -->
    <path d="M 0 -45
             C -6 -64, -46 -70, -62 -45
             C -76 -22, -46 3, 0 44
             C 46 3, 76 -22, 62 -45
             C 46 -70, 6 -64, 0 -45 Z"
          fill="none"
          stroke="rgba(255,250,240,0.35)"
          stroke-width="2.5"/>
    <!-- BX wordmark -->
    <text x="0" y="14"
          text-anchor="middle"
          fill="#fffaf0"
          font-family="Fredoka, 'Nunito', system-ui, sans-serif"
          font-weight="700"
          font-size="62"
          letter-spacing="-2">BX</text>
  </g>
</svg>
