<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="BX rainbow heart hero mark">
  <defs>
    <linearGradient id="hgRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#c8261d"/>
    </linearGradient>
  </defs>
  <!-- Rainbow concentric arcs (open at bottom for the "exchange" arrows) -->
  <g fill="none" stroke-linecap="round" stroke-width="9">
    <circle cx="160" cy="160" r="138" stroke="#e8413a" stroke-dasharray="700 1000" transform="rotate(-30 160 160)"/>
    <circle cx="160" cy="160" r="124" stroke="#ef8a2c" stroke-dasharray="660 1000" transform="rotate(-30 160 160)"/>
    <circle cx="160" cy="160" r="110" stroke="#f3c12f" stroke-dasharray="620 1000" transform="rotate(-30 160 160)"/>
    <circle cx="160" cy="160" r="96"  stroke="#46a85a" stroke-dasharray="580 1000" transform="rotate(-30 160 160)"/>
    <circle cx="160" cy="160" r="82"  stroke="#3b8ed0" stroke-dasharray="540 1000" transform="rotate(-30 160 160)"/>
    <circle cx="160" cy="160" r="68"  stroke="#8a4fb0" stroke-dasharray="500 1000" transform="rotate(-30 160 160)"/>
  </g>

  <!-- Tiny white sparkle dots along the rings -->
  <g fill="#fffaf0">
    <circle cx="250" cy="78"  r="3"/>
    <circle cx="298" cy="160" r="3"/>
    <circle cx="232" cy="252" r="3"/>
    <circle cx="86"  cy="244" r="3"/>
    <circle cx="36"  cy="160" r="3"/>
    <circle cx="84"  cy="74"  r="3"/>
  </g>

  <!-- Exchange arrows (top-right curving down, bottom-left curving up) -->
  <g fill="#fffaf0" stroke="#30210f" stroke-width="2" stroke-linejoin="round">
    <path d="M 246 50 L 280 70 L 264 104 L 252 88 C 290 130 280 200 230 232 L 218 218 C 256 192 268 142 246 110 L 232 124 Z"/>
    <path d="M 74 270 L 40 250 L 56 216 L 68 232 C 30 190 40 120 90 88 L 102 102 C 64 128 52 178 74 210 L 88 196 Z"/>
  </g>

  <!-- Heart sticker centerpiece -->
  <g transform="translate(160 165) rotate(-6)">
    <path d="M 0 -50
             C -8 -72, -50 -78, -68 -50
             C -84 -25, -50 6, 0 52
             C 50 6, 84 -25, 68 -50
             C 50 -78, 8 -72, 0 -50 Z"
          fill="url(#hgRed)"
          stroke="#30210f"
          stroke-width="4"
          stroke-linejoin="round"/>
    <text x="0" y="14"
          text-anchor="middle"
          fill="#fffaf0"
          font-family="Fredoka, 'Nunito', system-ui, sans-serif"
          font-weight="700"
          font-size="56"
          letter-spacing="-2">BX</text>
  </g>
</svg>
