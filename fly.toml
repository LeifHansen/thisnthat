# Fly.io configuration for ThisNThat.
# Secrets (DATABASE_URL, AUTH_SECRET, STRIPE_*, R2_*, ...) are NOT stored here.
# Set them with:  fly secrets set KEY=value --app thisnthat

app = "thisnthat"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
