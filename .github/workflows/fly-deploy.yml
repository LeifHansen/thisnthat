name: Deploy to Fly.io

# Deploys the `thisnthat` Fly app (see fly.toml). Pushing to the production
# branch deploys; the manual trigger is for re-deploying the current tree
# without a commit. Needs the FLY_API_TOKEN repository secret (and optionally
# NEXT_PUBLIC_GA_ID) — scripts/fly-setup.sh walks through creating both.
#
# `main` is the production branch: only pushes to a branch named below deploy.
# If the repository's default branch is still `claude/gallant-hopper-kzsuj4`,
# rename it to `main` (GitHub → Settings → Branches) — that branch is the
# superseded prototype and is deliberately no longer deployable from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # NEXT_PUBLIC_* values are inlined at build time, so the GA ID travels as
      # a build arg from a GitHub secret. The app URL is a public constant and
      # lives in fly.toml [build.args]; every other setting is a runtime
      # `fly secrets set` value.
      - run: >-
          flyctl deploy --remote-only --ha=false
          --build-arg NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
