name: Deploy to Fly.io

# Deploys the `thisnthat` Fly app (see fly.toml). Pushing to `main` deploys;
# the manual trigger is for re-deploying the current tree without a commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # NEXT_PUBLIC_* values are inlined at build time, so the GA ID travels as
      # a build arg from a GitHub secret. The app URL is a public constant and
      # lives in fly.toml [build.args]; every other setting is a runtime
      # `fly secrets set` value.
      - run: >-
          flyctl deploy --remote-only --ha=false
          --build-arg NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
